# AccessOS CI/CD Pipeline (ACCESSOS-041)
#
# Jobs:
#   build-and-test  — CMake + MSVC build, GoogleTest run, JUnit XML artifact
#   build-ui        — dotnet build WinUI 3 shell
#   package-msix    — dotnet publish → MSIX (Release only, on push to main)
#   release         — Create GitHub Release + upload MSIX artifact (on tag v*.*.*)
#
# Secrets required for release:
#   (none — uses GITHUB_TOKEN automatically)

name: CI/CD

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Debug
  CMAKE_PATH: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'

jobs:
  # ── Job 1: Build C++ core + run unit tests ───────────────────────────────────
  build-and-test:
    name: C++ Build & Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Debug)
        run: cmake --build build --config Debug --parallel

      - name: Run Unit Tests
        run: |
          ctest --test-dir build --build-config Debug --output-on-failure `
                --output-junit test-results.xml
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-results.xml
          retention-days: 30

      - name: Upload build artifacts (Debug DLL)
        uses: actions/upload-artifact@v4
        with:
          name: AccessOSCore-debug-${{ github.run_number }}
          path: build/bin/Debug/AccessOSCore_d.dll
          retention-days: 14

  # ── Job 2: Build WinUI 3 shell ───────────────────────────────────────────────
  build-ui:
    name: WinUI 3 Shell Build
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore src/UI/AccessOS.UI.csproj

      - name: Build WinUI 3 (Debug)
        run: dotnet build src/UI/AccessOS.UI.csproj -c Debug --no-restore

  # ── Job 3: Package MSIX (Release, push to main only) ─────────────────────────
  package-msix:
    name: Package MSIX
    runs-on: windows-latest
    needs: [ build-and-test, build-ui ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure CMake (Release)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ core (Release)
        run: cmake --build build --config Release --target AccessOSCoreDll --parallel

      - name: Publish WinUI 3 app (Release, x64)
        run: |
          dotnet publish src/UI/AccessOS.UI.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:Platform=x64 `
            -p:AppxPackageDir="${{ github.workspace }}/dist/" `
            -p:GenerateAppxPackageOnBuild=true

      - name: Copy Release DLL into publish output
        run: |
          $pubDir = Get-ChildItem "src/UI/bin/Release/net8.0-windows10.0.26100.0/win-x64" -Directory |
                    Where-Object { $_.Name -ne 'publish' } | Select-Object -First 1
          Copy-Item "build/bin/Release/AccessOSCore.dll" "dist/" -ErrorAction SilentlyContinue

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessOS-msix-${{ github.run_number }}
          path: dist/**/*.msix
          retention-days: 90

  # ── Job 4: GitHub Release (on tag v*.*.*) ─────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: windows-latest
    needs: package-msix
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: AccessOS-msix-${{ github.run_number }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       "AccessOS ${{ github.ref_name }}"
          body: |
            ## AccessOS ${{ github.ref_name }}

            ### What's included
            - AccessOS.UI.exe — WinUI 3 shell
            - AccessOSCore.dll — native accessibility core

            ### Installation
            1. Download and run the `.msix` package, **or**
            2. Run `msiexec /i AccessOS-Setup.msi` for the traditional MSI installer

            ### Release Notes
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            dist/**/*.msix
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
